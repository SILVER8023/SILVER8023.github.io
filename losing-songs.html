  <h1>落选歌单</h1>
  <p class="sub">每天被淘汰的那首歌也有个家。每日一首只取一首进歌单，没选上的候选都记在这里，等复活。</p>
  <div class="how">玩法：每日一首流程不变，只多一步——当天没选上的候选自动入档。每周复活夜由白雾亲手从馆里捞一首进正式歌单，复活后这里会翻成“已复活”并留一句复活理由。后来作为每日一首胜出入单的，会挪到下面的“已入单”区并标注入单日期，不再复活。落选不是不好听，只是那天没轮上。</div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function daysSince(d){
  const t = new Date(); t.setHours(0,0,0,0);
  const a = new Date(d+'T00:00:00');
  return Math.max(0, Math.round((t-a)/86400000));
}
function fmtDate(ds){var a=ds.split('-');return (+a[1])+'月'+(+a[2])+'日';}
function card(s){
  const days = daysSince(s.lost_date);
  let html = '<div class="card"><div class="date">'+esc(s.lost_date)+' 落选';
  if(s.selected_date) html += ' · 已于 '+fmtDate(s.selected_date)+'入单';
  else html += ' · 已等 '+days+' 天';
  if(s.selected_date) html += '<span class="badge selected">已入单</span>';
  else html += s.revived ? '<span class="badge revived">已复活</span>' : '<span class="badge waiting">落选馆中</span>';
  html += '</div><div class="title">';
  html += s.url ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>' : esc(s.title);
  html += ' — '+esc(s.artist)+'</div>';
  html += '<div class="meta">当天胜出：《'+esc(s.winner_title)+'》— '+esc(s.winner_artist)+'</div>';
  html += '<div class="meta">它差一点赢在哪：'+esc(s.reason==='未知' ? '未知（入档时未记录理由）' : s.reason)+'</div>';
  if(s.selected_date) html += '<div class="selected-note">这首后来被选走了，已在正式歌单里，不再复活。</div>';
  if(s.revived && s.revive_reason) html += '<div class="revive">复活理由：'+esc(s.revive_reason)+'</div>';
  if(s.note) html += '<div class="note">注：'+esc(s.note)+'</div>';
  return html + '</div>';
}
function renderDays(){
  const waiting = DATA.filter(s=>!s.selected_date).sort((a,b)=>a.lost_date.localeCompare(b.lost_date));
  const selected = DATA.filter(s=>s.selected_date).sort((a,b)=>a.selected_date.localeCompare(b.selected_date));
  let html = waiting.length ? waiting.map(card).join('') : '<p class="empty">馆里还是空的，第一首落选歌入档后出现在这里。</p>';
  if(selected.length) html += '<div class="group">已入单 · 不再复活（'+selected.length+' 首）</div>' + selected.map(card).join('');
  document.getElementById('list').innerHTML = html;
}
function renderArtist(){
  const groups = {};
  DATA.filter(s=>!s.selected_date).forEach(s=>{ (groups[s.artist] = groups[s.artist] || []).push(s); });
  const names = Object.keys(groups).sort();
  let html = '';
  names.forEach(n=>{
    const items = groups[n].sort((a,b)=>b.lost_date.localeCompare(a.lost_date));
    html += '<div class="group">'+esc(n)+'（'+items.length+' 首）</div>' + items.map(card).join('');
  });
  const selected = DATA.filter(s=>s.selected_date).sort((a,b)=>a.selected_date.localeCompare(b.selected_date));
  if(selected.length) html += '<div class="group">已入单 · 不再复活（'+selected.length+' 首）</div>' + selected.map(card).join('');
  document.getElementById('list').innerHTML = html || '<p class="empty">馆里还是空的，第一首落选歌入档后出现在这里。</p>';
}
function show(mode){
  document.getElementById('tab-days').className = mode==='days' ? 'on' : '';
  document.getElementById('tab-artist').className = mode==='artist' ? 'on' : '';
  if(mode==='days') renderDays(); else renderArtist();
}
const pickable = DATA.filter(s=>!s.selected_date && !s.revived);
const selected = DATA.filter(s=>s.selected_date);
const revived = DATA.filter(s=>s.revived).length;
document.getElementById('stats').textContent = '馆中共 '+DATA.length+' 首 · 待复活 '+pickable.length+' 首 · 已入单 '+selected.length+' 首 · 已复活 '+revived+' 首 · 等得最久的待复活落选于 '+ (pickable.length ? pickable.map(s=>s.lost_date).sort()[0] : '—');
show('days');
