<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声音标本馆 · 银色实验室</title>
<style>
  :root{--bg:#101418;--panel:#181e24;--ink:#e8e2d6;--ink2:#9aa5ad;--line:#2a333b;--accent:#d8b96a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.8}
  .wrap{max-width:720px;margin:0 auto;padding:56px 20px 80px}
  a{color:var(--accent)}
  h1{font-size:30px;letter-spacing:.12em;margin:0 0 6px}
  .sub{color:var(--ink2);font-size:14px;margin:0 0 28px}
  .how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:14px;color:var(--ink2);margin-bottom:36px}
  h2{font-size:18px;letter-spacing:.14em;margin:40px 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card .date{font-size:13px;color:var(--ink2);letter-spacing:.1em}
  .card .title{font-size:17px;margin:4px 0 10px}
  .card audio{width:100%;margin:6px 0}
  .note{font-size:14px;color:var(--ink2)}
  .stats{font-size:12.5px;color:var(--ink2)}
  .guess{display:flex;gap:8px;margin-top:10px}
  .guess input{flex:1;background:#101418;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:14px}
  .guess button{background:var(--accent);border:0;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer}
  .guess-msg{font-size:13px;color:var(--accent);margin-top:6px}
  .empty{color:var(--ink2);font-size:14px}
  footer{margin-top:56px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>声音标本馆</h1>
  <p class="sub">每天十秒，猜猜屋里在响什么。标本由柜台内置麦克风实录，攒一个冬天。</p>
  <div class="how">玩法：每天 10:00 柜台自动录一段屋里 10 秒的声音，先匿名挂出让人猜，次日揭晓声学画像。猜测只存在你自己的浏览器里，揭晓时可以对答案。白雾随时一句话也可即时录一段分析。</div>
  <h2>今日雾声 · 未揭晓</h2>
  <div id="hidden"></div>
  <h2>标本时间线 · 已揭晓</h2>
  <div id="revealed"></div>
  <footer>银色实验室 · 声音标本馆（IDEA-063）· 标本只取自柜台所在的那间屋子 · <a href="index.html">回实验室</a></footer>
</div>
<script>
const DATA = [{"id": "2026-10-26", "date": "2026-10-26", "file": "clips/2026-10-26.mp3", "status": "hidden", "note": "", "seconds": 10, "recorded_at": "12:02", "stats": {"duration": 10.0, "mean_volume": -49.6, "max_volume": -23.1, "segments": [[0.0, 0.59], [2.64, 4.79], [7.21, 9.06]], "character": "3段间歇声"}}];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function card(s, hidden){
  let html = '<div class="card"><div class="date">'+esc(s.date)+' · '+esc(s.recorded_at)+' · 柜台实录 '+esc(s.seconds)+' 秒</div>';
  html += '<div class="title">'+(hidden ? '今日雾声 —— 猜猜这是什么声音？' : '标本 '+esc(s.date))+'</div>';
  html += '<audio controls preload="none" src="'+esc(s.file)+'"></audio>';
  if(hidden){
    html += '<div class="guess"><input id="guess-'+esc(s.id)+'" placeholder="写下你的猜测，比如：烧水壶"><button onclick="saveGuess(\''+esc(s.id)+'\')">记下猜测</button></div><div class="guess-msg" id="guess-msg-'+esc(s.id)+'"></div>';
  } else {
    html += '<div class="note">'+esc(s.note)+'</div>';
    html += '<div class="stats">声学画像：'+esc(s.stats.character)+' · 最响 '+esc(s.stats.max_volume)+' dB · 平均 '+esc(s.stats.mean_volume)+' dB</div>';
    const g = localStorage.getItem('fog-sound-guess-'+s.id);
    if(g) html += '<div class="guess-msg">你当时猜的是：'+esc(g)+'</div>';
  }
  return html + '</div>';
}
function saveGuess(id){
  const el = document.getElementById('guess-'+id);
  const v = el.value.trim();
  if(!v) return;
  localStorage.setItem('fog-sound-guess-'+id, v);
  document.getElementById('guess-msg-'+id).textContent = '已记下你的猜测：'+v+'，明日揭晓时对答案。';
}
const hidden = DATA.filter(s=>s.status==='hidden').sort((a,b)=>b.date.localeCompare(a.date));
const revealed = DATA.filter(s=>s.status==='revealed').sort((a,b)=>b.date.localeCompare(a.date));
document.getElementById('hidden').innerHTML = hidden.length ? hidden.map(s=>card(s,true)).join('') : '<p class="empty">今日的雾声还没挂出，10:00 之后再来听。</p>';
document.getElementById('revealed').innerHTML = revealed.length ? revealed.map(s=>card(s,false)).join('') : '<p class="empty">还没有揭晓的标本，第一段雾声明日揭晓。</p>';
</script>
</body>
</html>
